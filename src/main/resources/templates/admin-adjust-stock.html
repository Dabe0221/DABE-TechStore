<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Adjust Product Stock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f5f7fb;
        }

        .form-card {
            max-width: 760px;
            margin: 0 auto;
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .current-stock {
            font-size: 2rem;
            font-weight: 700;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/admin/dashboard}">
            E-Commerce Admin
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link"
               th:href="@{/admin/products}">
                Products
            </a>

            <a class="nav-link"
               th:href="@{/admin/inventory}">
                Inventory
            </a>
        </div>
    </div>
</nav>

<main class="container py-5">

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <div class="card form-card">

        <div class="card-body p-4 p-md-5">

            <div class="mb-4">

                <a th:href="@{/admin/products}"
                   class="text-decoration-none">

                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Products
                </a>
            </div>

            <h1 class="h3 fw-bold mb-2">
                <i class="bi bi-boxes me-2"></i>
                Adjust Product Stock
            </h1>

            <p class="text-muted mb-4">
                Add or deduct inventory for this product.
            </p>

            <div class="border rounded-3 p-3 mb-4 bg-light">

                <div class="row align-items-center">

                    <div class="col-md-8">

                        <div class="text-muted small">
                            Product
                        </div>

                        <div class="fs-5 fw-bold"
                             th:text="${product.name}">
                            Product name
                        </div>

                        <div class="text-muted">
                            Product ID:
                            <span th:text="${product.id}">
                                1
                            </span>
                        </div>
                    </div>

                    <div class="col-md-4 text-md-end mt-3 mt-md-0">

                        <div class="text-muted small">
                            Current Stock
                        </div>

                        <div class="current-stock"
                             th:text="${product.stock}">
                            0
                        </div>
                    </div>
                </div>
            </div>

            <form method="post"
                  th:action="@{/admin/products/{id}/adjust-stock(id=${product.id})}">

                <div class="mb-3">

                    <label for="adjustmentType"
                           class="form-label fw-semibold">
                        Adjustment Type
                    </label>

                    <select id="adjustmentType"
                            name="adjustmentType"
                            class="form-select"
                            required>

                        <option value="">
                            Select an adjustment
                        </option>

                        <option value="ADD">
                            Add Stock
                        </option>

                        <option value="DEDUCT">
                            Deduct Stock
                        </option>
                    </select>
                </div>

                <div class="mb-3">

                    <label for="quantity"
                           class="form-label fw-semibold">
                        Quantity
                    </label>

                    <input type="number"
                           id="quantity"
                           name="quantity"
                           class="form-control"
                           min="1"
                           required>

                    <div class="form-text">
                        Enter a positive number.
                    </div>
                </div>

                <div class="mb-4">

                    <label for="reason"
                           class="form-label fw-semibold">
                        Reason
                    </label>

                    <textarea id="reason"
                              name="reason"
                              class="form-control"
                              rows="4"
                              maxlength="500"
                              placeholder="Example: New delivery, damaged stock, correction..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/admin/products}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-check-circle me-1"></i>
                        Update Stock
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script th:src="@{/js/loading-buttons.js}"></script>
</body>
</html>
